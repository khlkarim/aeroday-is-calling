<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Tunisian Aeroday — Incoming call</title>
<style>
:root{
  color-scheme:dark;
  --fg:#fff; --muted:rgba(255,255,255,.72);
  --green:#34c759; --red:#ff3b30; --accent:#ff4b55;
  --btn:clamp(64px,19vw,76px); --label:26px;
  --exit:600ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--fg);overflow:hidden;overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.screen{position:fixed;inset:0}

/* ---------- Event screen (revealed under the call) ---------- */
#event{display:flex;align-items:center;justify-content:center;text-align:center;visibility:hidden;
  padding:max(24px,env(safe-area-inset-top)) 28px max(24px,env(safe-area-inset-bottom));
  background:#000;overflow:hidden}
#eventBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(18px);transform:scale(1.12)}
.event-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.5) 50%,rgba(0,0,0,.72))}
#app[data-state="answering"] #event,#app[data-state="event"] #event{visibility:visible}
.event-content{position:relative;z-index:1;max-width:34rem;display:flex;flex-direction:column;gap:1.1rem;
  opacity:0;transform:translateY(32px);transition:opacity var(--exit) ease,transform var(--exit) ease}
#app[data-state="answering"] .event-content,#app[data-state="event"] .event-content{opacity:1;transform:none}
#app[data-state="event"] .event-content{transition:none}
.event-content h1{margin:0;font-size:clamp(2.2rem,11vw,4.5rem);line-height:1.02;font-weight:800;letter-spacing:-.02em}
.event-content .title{margin:0;font-size:clamp(1rem,4.5vw,1.5rem);font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.event-content .pitch{margin:.6rem 0 0;font-size:clamp(1.05rem,4.6vw,1.4rem);line-height:1.45;color:var(--muted)}
.event-content .where{margin:.6rem 0 0;font-size:clamp(1.8rem,8vw,3rem);font-weight:700;line-height:1.15}
.event-content .when{margin:0;font-size:clamp(1.8rem,8vw,3rem);font-weight:300;line-height:1.15;color:var(--muted)}

/* ---------- Incoming call screen ---------- */
#call{z-index:2;background:#000;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(56px,calc(env(safe-area-inset-top) + 32px)) 24px max(24px,env(safe-area-inset-bottom));
  transition:transform var(--exit) cubic-bezier(.7,0,.2,1);will-change:transform}
#app[data-state="answering"] #call{transform:translateY(-100%)}
#app[data-state="event"] #call{display:none}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity 500ms ease;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:blur(18px);transform:scale(1.12)}
.bg.on{opacity:1}
.overlay{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 55% at 50% 22%,rgba(40,80,160,.28),transparent 70%),
             linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,.35) 45%,rgba(0,0,0,.7))}
.caller,.actions{position:relative;z-index:1}
.caller{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.incoming{font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1.4rem}
.avatar{position:relative;width:96px;height:96px;border-radius:50%;margin-bottom:1.2rem;background:#111;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.avatar::before,.avatar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:ring 2.4s ease-out infinite}
.avatar::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2);opacity:0}}
.caller h1{margin:0;font-size:clamp(2rem,10vw,3.2rem);line-height:1.05;font-weight:700;letter-spacing:-.01em}
.caller .sub{margin:0;font-size:clamp(1rem,4.5vw,1.3rem);color:var(--muted)}

.actions{width:min(100%,420px);margin:0 auto;height:clamp(230px,40vh,380px)}
.ctrl{position:absolute;width:var(--btn);height:var(--btn)}
.ctrl button{width:100%;height:100%;border:0;border-radius:50%;color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.45);font:inherit;padding:0}
.ctrl button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.ctrl svg{width:36px;height:36px;pointer-events:none}
.label{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:.85rem;color:var(--muted);white-space:nowrap;pointer-events:none;user-select:none}

#answer{right:12%;bottom:calc(var(--label) + 8px);z-index:3;transition:transform 250ms ease-out;--p:0}
#answer.dragging{transition:none}
#answer button{background:var(--green);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 calc(var(--p) * 14px) rgba(52,199,89,.28)}
#answer.dragging button{cursor:grabbing}
#answer .label{opacity:calc(1 - var(--p) * 2)}
.hint{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;
  color:var(--muted);font-size:.8rem;pointer-events:none;user-select:none;opacity:calc(1 - var(--p) * 3)}
.hint span{white-space:nowrap}
.chev{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(4px);opacity:.4}50%{transform:translateY(-4px);opacity:1}}

#hang{left:0;top:0;visibility:hidden;z-index:2;will-change:transform}
#hang.ready{visibility:visible;transition:transform 220ms cubic-bezier(.2,.9,.3,1.15)}
#hang button{background:var(--red);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#hang svg{transform:rotate(135deg)}

@media (prefers-reduced-motion:reduce){
  :root{--exit:1ms}
  .avatar::before,.avatar::after,.chev{animation:none}
  .bg{transition:none}
  #answer,#hang.ready{transition:none}
}
</style>
</head>
<body>
<div id="app" data-state="calling">

  <!-- Event "page" (route: #/event) -->
  <main id="event" class="screen" aria-label="Event information">
    <img id="eventBg" alt="" aria-hidden="true" draggable="false">
    <div class="event-overlay"></div>
    <div class="event-content">
      <h1 data-bind="name"></h1>
      <p class="title" data-bind="title"></p>
      <p class="pitch" data-bind="pitch"></p>
      <p class="where" data-bind="location"></p>
      <p class="when" data-bind="time"></p>
    </div>
  </main>

  <!-- Incoming call (route: #/) -->
  <section id="call" class="screen" aria-label="Incoming call">
    <img class="bg" alt="" aria-hidden="true" draggable="false">
    <img class="bg" alt="" aria-hidden="true" draggable="false">
    <div class="overlay"></div>

    <div class="caller">
      <div class="incoming">Incoming call</div>
      <div class="avatar" aria-hidden="true"><div class="face"><img id="avatarImg" alt="" draggable="false"></div></div>
      <h1 data-bind="name"></h1>
      <p class="sub" data-bind="title"></p>
    </div>

    <div class="actions" id="actions">
      <div class="ctrl" id="hang">
        <button type="button" aria-label="Hang up">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <span class="label" aria-hidden="true">Hang Up</span>
      </div>

      <div class="ctrl" id="answer">
        <div class="hint" aria-hidden="true">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
          <span>Swipe up</span>
        </div>
        <button type="button" aria-label="Answer call" aria-describedby="answer-help">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <span class="label" aria-hidden="true">Answer</span>
        <span id="answer-help" hidden>Drag upward to answer, or press Enter or the up arrow key.</span>
      </div>
    </div>
  </section>
</div>

const ANSWER_THRESHOLD = 120;  // px dragged up to answer
const MAX_DRAG = 240;          // px, upward clamp
const EXIT_MS = 600;           // keep in sync with --exit
const MIN_MOVE_DISTANCE = 80;  // px, hang-up must jump at least this far
const MARGIN = 8;              // px, keeps hang-up away from edges
const LABEL_SPACE = 26;        // px reserved under the button for its label

/* ---------- Elements & state ---------- */
const $ = (s) => document.querySelector(s);
const app = $("#app"), call = $("#call"), actions = $("#actions");
const answerEl = $("#answer"), answerBtn = answerEl.querySelector("button");
const hangEl = $("#hang"), hangBtn = hangEl.querySelector("button");
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let state = "calling";         // calling -> answering -> event
let hangPos = null;            // {x, y} within .actions

document.querySelectorAll("[data-bind]").forEach((el) => { el.textContent = EVENT[el.dataset.bind]; });

/* ---------- Background photos ---------- */
const layers = [...document.querySelectorAll(".bg")];
const avatarImg = $("#avatarImg"), eventBg = $("#eventBg");
let bgIndex = Math.floor(Math.random() * BACKGROUNDS.length);
let topLayer = 0;
function showBackground(i, instant) {
  const layer = layers[instant ? topLayer : 1 - topLayer];
  const { src, x } = BACKGROUNDS[i];
  layer.onerror = () => { layer.classList.remove("on"); }; // failure -> black fallback
  layer.src = src;
  layer.style.objectPosition = `${x}% center`;
  for (const el of [avatarImg, eventBg]) { el.src = src; el.style.objectPosition = `${x}% center`; }
  layer.classList.add("on");
  if (!instant) { layers[topLayer].classList.remove("on"); topLayer = 1 - topLayer; }
}
function nextBackground() {
  bgIndex = (bgIndex + 1) % BACKGROUNDS.length; // sequential, not random
  showBackground(bgIndex, false);
}
showBackground(bgIndex, true);

let lastHangPress = 0;
call.addEventListener("click", (e) => {
  if (state !== "calling" || e.target.closest(".ctrl")) return;
  if (performance.now() - lastHangPress < 500) return; // ignore the tail of a hang-up tap
  nextBackground();
});

function setState(next) { state = next; app.dataset.state = next; }

/* ---------- Routing (hash based: "#/" and "#/event") ---------- */
function route() {
  if (location.hash === "#/event") {
    setState("event");
  } else {
    setState("calling");
    setAnswerOffset(0, false);
    requestAnimationFrame(() => placeHang(homePos()));
  }
}
addEventListener("hashchange", route);

/* ---------- Answer: drag up with Pointer Events ---------- */
let drag = null;

function setAnswerOffset(offset, dragging) {
  answerEl.classList.toggle("dragging", dragging);
  answerEl.style.transform = offset ? `translateY(${offset}px)` : "";
  answerEl.style.setProperty("--p", Math.min(1, -offset / ANSWER_THRESHOLD).toFixed(3));
}
function offsetFor(clientY) {
  return Math.max(-MAX_DRAG, Math.min(0, clientY - drag.startY)); // upward only, clamped
}

answerBtn.addEventListener("pointerdown", (e) => {
  if (state !== "calling" || drag) return;
  e.preventDefault();
  answerBtn.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, startY: e.clientY };
  setAnswerOffset(0, true);
});
answerBtn.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  setAnswerOffset(offsetFor(e.clientY), true);
});
answerBtn.addEventListener("pointerup", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const offset = offsetFor(e.clientY);
  drag = null;
  if (-offset >= ANSWER_THRESHOLD) { setAnswerOffset(offset, false); answer(); }
  else setAnswerOffset(0, false); // snap back
});
const cancelDrag = (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null; setAnswerOffset(0, false);
};
answerBtn.addEventListener("pointercancel", cancelDrag);
answerBtn.addEventListener("lostpointercapture", cancelDrag);
// Keyboard users can't drag: Enter / Space / ArrowUp answer. Plain taps/clicks do nothing.
answerBtn.addEventListener("keydown", (e) => {
  if (["Enter", " ", "ArrowUp"].includes(e.key) && state === "calling") { e.preventDefault(); answer(); }
});
answerBtn.addEventListener("click", (e) => e.preventDefault());

/* ---------- Answer -> slide up -> navigate ---------- */
function goToEvent() {
  if (state === "event") return;
  location.hash = "#/event";            // new history entry, so Back returns to the call
}
function answer() {
  if (state !== "calling") return;
  if (reduceMotion()) { goToEvent(); return; }
  setState("answering");
  let done = false;
  const finish = () => { if (done) return; done = true; call.removeEventListener("transitionend", onEnd); goToEvent(); };
  const onEnd = (e) => { if (e.target === call && e.propertyName === "transform") finish(); };
  call.addEventListener("transitionend", onEnd);
  setTimeout(finish, EXIT_MS + 400);    // safety net if transitionend never fires
}

/* ---------- Hang up: evasive, bounded by .actions ---------- */
function bounds() {
  const s = hangEl.offsetWidth;
  return {
    s,
    maxX: Math.max(MARGIN, actions.clientWidth - s - MARGIN),
    maxY: Math.max(MARGIN, actions.clientHeight - s - LABEL_SPACE - MARGIN),
  };
}
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function homePos() {            // bottom-left, mirroring the answer button
  const { maxY } = bounds();
  return { x: Math.max(MARGIN, actions.clientWidth * 0.12), y: maxY };
}
function placeHang(p) {
  const { maxX, maxY } = bounds();
  hangPos = { x: Math.min(Math.max(p.x, MARGIN), maxX), y: Math.min(Math.max(p.y, MARGIN), maxY) };
  hangEl.style.transform = `translate(${hangPos.x}px, ${hangPos.y}px)`;
  hangEl.classList.add("ready");
}
function moveHang() {
  if (!hangPos) return;
  const { s, maxX, maxY } = bounds();
  const answerHome = { x: answerEl.offsetLeft, y: answerEl.offsetTop }; // unaffected by drag transform
  const clearance = s + 16;
  let best = null, bestScore = -1;
  for (let i = 0; i < 12; i++) {
    const cand = { x: rand(MARGIN, maxX), y: rand(MARGIN, maxY) };
    const dMove = dist(cand, hangPos), dAns = dist(cand, answerHome);
    if (dMove >= MIN_MOVE_DISTANCE && dAns >= clearance) { best = cand; break; }
    const score = Math.min(dMove / MIN_MOVE_DISTANCE, dAns / clearance);
    if (score > bestScore) { bestScore = score; best = cand; }
  }
  placeHang(best);
}
hangBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); lastHangPress = performance.now(); if (state === "calling") moveHang(); });
hangBtn.addEventListener("click", (e) => { e.preventDefault(); if (state === "calling") moveHang(); }); // keyboard activation

new ResizeObserver(() => {
  if (state === "event") return;
  placeHang(hangPos || homePos()); // clamps into the new bounds
}).observe(actions);

route();
</script>
